[package]
name = "bloom-vault"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bloom-kernel = { path = "../bloom-kernel" }
bloom-state = { path = "../bloom-state" }
bloom-text = { path = "../bloom-text" }
blake3 = "1"
tempfile = "3"

[dev-dependencies]
bloom-kernel = { path = "../bloom-kernel", features = ["simulation"] }
bloom-state = { path = "../bloom-state", features = ["test-hooks"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
